<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="Frontend Mentor Challenge: Product Preview Card."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <link rel="stylesheet" href="css/style.css" />

    <title>Frontend Mentor | Product preview card component</title>
  </head>
  <body>
    <main class="product-preview-card-container">
      <picture>
        <source
          srcset="images/image-product-mobile.jpg"
          media="(max-width: 38.1em)"
        />
        <img
          src="images/image-product-desktop.jpg"
          alt="Gabrielle Chanel perfume"
          class="product-preview-card__img"
        />
      </picture>
      <div class="product-preview-card-content">
        <div class="product-preview-card-header">
          <span class="product-preview-card__category">Perfume</span>
          <h2 class="product-preview-card__name">
            Gabrielle Essence Eau De Parfum
          </h2>
          <p class="product-preview-card__description">
            A floral, solar and voluptuous interpretation composed by Olivier
            Polge, Perfumer-Creator for the House of CHANEL.
          </p>
        </div>
        <div class="product-preview-card-price-box">
          <span class="product-preview-card__price--current">$149.99</span>
          <del class="product-preview-card__price--original">$169.99</del>
        </div>
        <button class="product-preview-card__btn">
          <img
            src="images/icon-cart.svg"
            alt=""
            aria-hidden="true"
            class="product-preview-card__icon"
          />
          Add to Cart
        </button>
      </div>
    </main>
  </body>
</html>
